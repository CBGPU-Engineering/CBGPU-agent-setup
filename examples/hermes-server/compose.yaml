services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        /opt/hermes/.venv/bin/python -c 'from pathlib import Path; from urllib.request import urlopen; from hashlib import sha256; import runpy; import sys; p = Path("/opt/data/.cbgpu_setup.py"); expected = "cff25c162aefdfc4d00731b4b0bd07e0c20ed799cb78ad8321b9c9e0e6fe876b"; raw = p.read_bytes() if p.is_file() else b""; raw = raw if sha256(raw).hexdigest() == expected else urlopen("https://raw.githubusercontent.com/CBGPU-Engineering/CBGPU-agent-setup/0c31c4c5cd63954f2ec09a63b584c5e02e46e67f/examples/hermes-server/cbgpu_setup.py", timeout=20).read(); assert sha256(raw).hexdigest() == expected, "Invalid CBGPU startup script digest"; p.write_bytes(raw); sys.path.insert(0, "/opt/hermes"); sys.argv = [str(p), "configure"]; runpy.run_path(str(p), run_name="__main__")'
        exec hermes gateway run --replace
    working_dir: /opt/data
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME_MODE: "0700"
      HERMES_DASHBOARD: "0"
      HERMES_REDACT_SECRETS: "true"
      TELEGRAM_ALLOWED_CHATS: "0"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_GATEWAY_API_KEY:?Set a dedicated gateway API key}"
      CBGPU_API_KEY: "${CBGPU_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${HERMES_TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${HERMES_TELEGRAM_ALLOWED_USERS:-}"
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD", "/command/s6-setuidgid", "hermes", "/opt/hermes/.venv/bin/python", "-c", "import runpy,sys; sys.path.insert(0, '/opt/hermes'); sys.argv=['/opt/data/.cbgpu_setup.py', 'check']; runpy.run_path(sys.argv[0], run_name='__main__')"]
      interval: 15s
      timeout: 75s
      retries: 4
      start_period: 45s
volumes:
  hermes-data:
