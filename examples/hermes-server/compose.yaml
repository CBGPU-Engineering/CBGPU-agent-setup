services:
  hermes:
    build: .
    restart: unless-stopped
    command: ["gateway", "run"]
    working_dir: /opt/data
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME_MODE: "0700"
      HERMES_DASHBOARD: "0"
      HERMES_REDACT_SECRETS: "true"
      TELEGRAM_ALLOWED_CHATS: "0"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_GATEWAY_API_KEY:?Set a dedicated gateway API key}"
      CBGPU_API_KEY: "${CBGPU_API_KEY:?Set the CBGPU AI key}"
      TELEGRAM_BOT_TOKEN: "${HERMES_TELEGRAM_BOT_TOKEN:?Set the cloud Telegram bot token}"
      TELEGRAM_ALLOWED_USERS: "${HERMES_TELEGRAM_ALLOWED_USERS:?Set the allowed Telegram user ID}"
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD", "/command/s6-setuidgid", "hermes", "/opt/hermes/.venv/bin/python", "/opt/hermes/cbgpu_setup.py", "check"]
      interval: 15s
      timeout: 75s
      retries: 4
      start_period: 45s
volumes:
  hermes-data:
